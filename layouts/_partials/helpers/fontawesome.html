{{ $fontawsomeCSSList := slice "fontawesome.min.css" "solid.min.css" "regular.min.css" }}

{{ range $fontawsomeCSSList }}
    {{ $fontawsomeCSS := resources.Get (printf "node_modules/@fortawesome/fontawesome-free/css/%s" .) | minify | fingerprint }}
<link rel="stylesheet"
    href="{{ $fontawsomeCSS.Permalink }}"
        integrity="{{ $fontawsomeCSS.Data.Integrity }}"
        crossorigin="anonymous"
    referrerpolicy="no-referrer">
{{ end }}
