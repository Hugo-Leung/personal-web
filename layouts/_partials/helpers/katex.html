{{ $katexCSS := resources.Get "node_modules/katex/dist/katex.min.css" | fingerprint}}
{{ $katexJS := resources.Get "node_modules/katex/dist/katex.min.js" | fingerprint}}
{{ $katexAutoRenderJS := resources.Get "node_modules/katex/dist/contrib/auto-render.min.js" | fingerprint}}

<link 
    rel="stylesheet"
    href="{{ $katexCSS.Permalink }}"
		integrity="{{ $katexCSS.Data.Integrity }}"
		crossorigin="anonymous"
    referrerpolicy="no-referrer">

<script
    defer
    src="{{ $katexJS.Permalink }}"
		integrity="{{ $katexJS.Data.Integrity }}"
		crossorigin="anonymous"
    referrerpolicy="no-referrer"
    type="text/javascript"></script>

<script
    defer
		src="{{ $katexAutoRenderJS.Permalink }}"
		integrity="{{ $katexAutoRenderJS.Data.Integrity }}"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
    type="text/javascript"></script>

<script type="text/javascript">
  document.addEventListener("DOMContentLoaded", function() {
    renderMathInElement(document.body, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "\\[", right: "\\]", display: true},
        {left: "$", right: "$", display: false},
        {left: "\\(", right: "\\)", display: false},
      ],
    });
  });
</script>
