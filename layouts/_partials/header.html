<!DOCTYPE html>
<html lang='{{ .Site.Language.Lang }}'>
{{- partial "head/head" . -}}

<body>

  {{ partialCached "sidebar/sidebar" .}}

  <div class="content-wrapper">
    <div class="page-header">
      {{ if .Site.Params.breadcrumb }}
        {{ partial "breadcrumb" .}}
      {{ end }}
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
        <i class="fa-solid fa-moon" aria-hidden="true"></i>
        <i class="fa-regular fa-sun" aria-hidden="true" hidden></i>
      </button>
    </div>
    <main id="content" class="{{ .Section }}">
